<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linkcraft URL Shortener</title><style>body{margin:0;background:#f4f6fb;color:#1c2940;font:16px system-ui}.wrap{max-width:850px;margin:9vh auto;padding:24px}.card{background:white;border:1px solid #e3e8f1;border-radius:20px;padding:34px;box-shadow:0 20px 55px #18284912}h1{font-size:38px;letter-spacing:-.04em;margin:6px 0}p{color:#718097}input,button{font:inherit;padding:14px;border-radius:9px}input{width:calc(100% - 30px);border:1px solid #dce2ed}button{margin-top:12px;border:0;background:#4d68d9;color:white;cursor:pointer}.result{display:none;margin-top:18px;padding:16px;background:#eef2ff;border-radius:10px}a{color:#405bd1}</style></head><body><main class="wrap"><p>LINKCRAFT · URL SHORTENER</p><section class="card"><p>SHORTEN A LINK</p><h1>Long links. Meet their shorter side.</h1><p>Create a clean, shareable link in seconds.</p><form id="f"><input id="url" type="url" required placeholder="https://example.com/a/very/long/link"><br><button>Create short link →</button></form><div class="result" id="r"></div></section></main><script>f.addEventListener('submit',async e=>{e.preventDefault();let q=await fetch('/api/urls',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url.value})}),d=await q.json();r.style.display='block';r.innerHTML=q.ok?'Your short link: <a target=_blank href="/'+d.code+'">'+location.origin+'/'+d.code+'</a>':(d.detail||'Unable to create link')})</script></body></html>
